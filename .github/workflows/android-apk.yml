# 안드로이드 앱(APK)을 만들어 GitHub Releases에 올립니다.
# 친구들에게 보낼 링크:
#   https://github.com/mw-JHC/Claude_based_test/releases/latest
# 설정 방법은 docs/DOWNLOAD_LINK.md 참고.
name: Android APK

on:
  # Actions 탭에서 "Run workflow" 버튼으로 직접 실행
  workflow_dispatch:
  # main에 앱 코드가 바뀌면 자동으로 새 버전
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 서명 키가 없으면 빌드하지 않고 안내만 남깁니다.
      # (매번 다른 키로 서명하면 친구들이 업데이트를 설치할 수 없어서)
      - name: Check signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::서명 키(Secrets)가 아직 없어서 APK를 만들지 않았습니다. docs/DOWNLOAD_LINK.md 의 1~2단계를 해 주세요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          # Android Studio와 같은 Java 21 (17이면 카메라 플러그인 검사(lint)가 멈춤)
          java-version: "21"

      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.ok == 'true'
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Write signing key
        if: steps.key.outputs.ok == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE" | tr -d '\r\n ' | base64 -d > android/app/upload.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS:-upload}"
            echo "storeFile=upload.jks"
          } > android/key.properties

      - name: Test
        if: steps.key.outputs.ok == 'true'
        run: |
          flutter pub get
          flutter test

      # 버전 이름은 pubspec.yaml에서, 버전 번호는 실행할 때마다 1씩 올려서
      # (번호가 커야 이미 설치한 앱 위에 업데이트로 설치됩니다)
      - name: Build APK
        if: steps.key.outputs.ok == 'true'
        id: build
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          CODE=$((100 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-name="$NAME" --build-number="$CODE"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/WhiskyLibrary.apk
          cp build/app/outputs/flutter-apk/app-release.apk "dist/WhiskyLibrary-$NAME-$CODE.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.key.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.name }}-${{ steps.build.outputs.code }}
          name: Whisky Library ${{ steps.build.outputs.name }} (${{ steps.build.outputs.code }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/WhiskyLibrary.apk
            dist/WhiskyLibrary-${{ steps.build.outputs.name }}-${{ steps.build.outputs.code }}.apk
          body: |
            ## 설치 방법 (안드로이드)
            1. 아래 **Assets**에서 `WhiskyLibrary.apk`를 눌러 내려받습니다.
            2. 다운로드한 파일을 엽니다. "출처를 알 수 없는 앱" 설치를 허용하라고 하면 허용합니다.
            3. Play 프로텍트 경고가 나오면 **세부정보 → 무시하고 설치**를 누릅니다.
            4. 새 버전도 같은 방법으로 설치하면 기록은 그대로 두고 업데이트됩니다.

            ## How to install (Android)
            1. Download `WhiskyLibrary.apk` from **Assets** below.
            2. Open it and allow installing from this source when asked.
            3. If Play Protect warns you, tap **More details → Install anyway**.
            4. Install newer versions the same way; your notes are kept.
